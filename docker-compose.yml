services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rating_app_web
    restart: unless-stopped
    command: sh -c "node src/scripts/initDb.js && node src/server.js"
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=rating_user
      - DB_PASSWORD=rating_secure_password_2026
      - DB_NAME=rating_app
      - JWT_SECRET=change_this_to_a_random_production_secret
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: rating_app_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_master_password_2026
      MYSQL_DATABASE: rating_app
      MYSQL_USER: rating_user
      MYSQL_PASSWORD: rating_secure_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_master_password_2026"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    driver: local
